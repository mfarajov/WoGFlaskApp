<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Currency Roulette Game</title>
</head>
<body>
    <h1>Currency Roulette Game</h1>
    <p>Welcome, {{ name }}! You are playing Currency Roulette Game with difficulty level: {{ difficulty }}</p>
    <p>How much do you think {{ amount_in_usd }} USD is in ILS?</p>
    <form action="" method="POST">
        <input type="number" step="any" name="guess" required>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
