version: '3.8'

services:
  worldofgames:
    build:
      context: .
      dockerfile: Dockerfile
    image: "muradvalehfarajov/worldofgames:latest"
    container_name: worldofgames-container
    ports:
      - "8777:8777"
    volumes:
      - ./Scores.txt:/app/Scores.txt
    environment:
      FLASK_APP: start.py
      FLASK_RUN_HOST: 0.0.0.0
      FLASK_RUN_PORT: 8777
