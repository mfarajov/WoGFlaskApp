version: '3.8'

services:
  worldofgames:
#    image: "muradvalehfarajov/worldofgames:${IMAGE_TAG:-latest}"
    image: "muradvalehfarajov/worldofgames:${IMAGE_TAG}"
    container_name: worldofgames-container
    ports:
      - "8777:8777"
    volumes:
      - ./Scores.txt:/app/Scores.txt
    environment:
      FLASK_APP: start.py
      FLASK_RUN_HOST: 0.0.0.0
      FLASK_RUN_PORT: 8777
